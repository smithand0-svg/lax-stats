---
deployment:
  tasks:
    - source /home/andyldn/nodevenv/lax-stats-git/.next/standalone/20/bin/activate
    - export DEPLOYPATH=/home/andyldn/lax-stats-git/
    - cd $DEPLOYPATH && rm -rf .next/standalone/node_modules
    - cd $DEPLOYPATH && npm install --include=dev
    - cd $DEPLOYPATH && npm run build
    - cd $DEPLOYPATH && rm -rf .next/standalone/public .next/standalone/.next/static
    - cd $DEPLOYPATH && cp -r public .next/standalone/public
    - cd $DEPLOYPATH && mkdir -p .next/standalone/.next/static && cp -r .next/static/* .next/standalone/.next/static/
